site_name: DSA Atlas
site_url: https://buicongnguyen.github.io/Leetcode/
site_author: buicongnguyen
site_description: A tested, chapter-based LeetCode problem-solving handbook in C++17 and Python 3.
repo_name: buicongnguyen/Leetcode
repo_url: https://github.com/buicongnguyen/Leetcode
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 buicongnguyen · MIT

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  icon:
    repo: fontawesome/brands/github
  features:
    - content.action.edit
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.path
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Use light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - .
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/extra.js

nav:
  - Start here:
      - Home: index.md
      - "Chapter 0 · How to use this book": chapter_00_preface/index.md
  - Foundations:
      - "Chapter 1 · Solve before coding": chapter_01_problem_solving/index.md
      - "Chapter 2 · Complexity and constraints": chapter_02_complexity/index.md
  - Core structures:
      - "Chapter 3 · Arrays and hashing": chapter_03_arrays_hashing/index.md
      - "Chapter 4 · Stacks, queues, and windows": chapter_04_linear_structures/index.md
      - "Chapter 5 · Trees and heaps": chapter_05_trees_heaps/index.md
      - "Chapter 6 · Graphs": chapter_06_graphs/index.md
  - Search strategies:
      - "Chapter 7 · Search and sort": chapter_07_search_sort/index.md
      - "Chapter 8 · Backtracking": chapter_08_backtracking/index.md
      - "Chapter 9 · Dynamic programming": chapter_09_dynamic_programming/index.md
  - Advanced:
      - "Chapter 10 · Advanced graphs":
          - Overview and chooser: chapter_10_advanced_graphs/index.md
          - Minimum spanning trees: chapter_10_advanced_graphs/minimum_spanning_trees.md
          - Network flow: chapter_10_advanced_graphs/network_flow.md
          - Bellman–Ford: chapter_10_advanced_graphs/bellman_ford.md
          - Floyd–Warshall: chapter_10_advanced_graphs/floyd_warshall.md
          - Strongly connected components: chapter_10_advanced_graphs/strongly_connected_components.md
          - Bridges and articulation points: chapter_10_advanced_graphs/bridges_articulation_points.md
          - LCA and binary lifting: chapter_10_advanced_graphs/lca_binary_lifting.md
      - "Chapter 11 · Composite structures":
          - Overview and design method: chapter_11_composite_structures/index.md
          - LRU cache: chapter_11_composite_structures/lru_cache.md
          - LFU cache: chapter_11_composite_structures/lfu_cache.md
          - Randomized set: chapter_11_composite_structures/randomized_set.md
          - Streaming median: chapter_11_composite_structures/streaming_median.md
          - Time-based key-value store: chapter_11_composite_structures/time_map.md
          - Min stack: chapter_11_composite_structures/min_stack.md
          - Design Twitter: chapter_11_composite_structures/design_twitter.md
          - All O(1) data structure: chapter_11_composite_structures/all_one.md
          - Number containers: chapter_11_composite_structures/number_containers.md
          - Snapshot array: chapter_11_composite_structures/snapshot_array.md
  - Appendix:
      - Quick reference: appendix/quick_reference.md
      - Contributing: appendix/contributing.md
