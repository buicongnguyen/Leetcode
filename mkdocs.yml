site_name: DSA Atlas
site_url: https://buicongnguyen.github.io/Leetcode/
site_author: buicongnguyen
site_description: A tested, chapter-based LeetCode problem-solving handbook in C++17 and Python 3.
repo_name: buicongnguyen/Leetcode
repo_url: https://github.com/buicongnguyen/Leetcode
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 buicongnguyen · MIT

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  icon:
    repo: fontawesome/brands/github
  features:
    - content.action.edit
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.path
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Use light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - .
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/extra.js

nav:
  - Start here:
      - Home: index.md
      - "Chapter 0 · How to use this book": chapter_00_preface/index.md
  - Foundations:
      - "Chapter 1 · Solve before coding": chapter_01_problem_solving/index.md
      - "Chapter 2 · Complexity and constraints": chapter_02_complexity/index.md
  - Core structures:
      - "Chapter 3 · Arrays and hashing": chapter_03_arrays_hashing/index.md
      - "Chapter 4 · Stacks, queues, and windows": chapter_04_linear_structures/index.md
      - "Chapter 5 · Trees and heaps": chapter_05_trees_heaps/index.md
      - "Chapter 6 · Graphs": chapter_06_graphs/index.md
  - Search strategies:
      - "Chapter 7 · Search and sort": chapter_07_search_sort/index.md
      - "Chapter 8 · Backtracking": chapter_08_backtracking/index.md
      - "Chapter 9 · Dynamic programming": chapter_09_dynamic_programming/index.md
  - Advanced:
      - "Chapter 10 · Advanced graphs": chapter_10_advanced_graphs/index.md
      - "Chapter 11 · Composite structures": chapter_11_composite_structures/index.md
  - Appendix:
      - Quick reference: appendix/quick_reference.md
      - Contributing: appendix/contributing.md
